<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Reply from Ar-Ra’d</title>
</head>
    <body style="margin:0; padding:0; font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif;">

        <div style="max-width:600px; margin:40px auto; padding:25px; background:#121212; border-radius:15px; box-shadow:0 4px 20px rgba(0,0,0,0.6); color:#e0e0e0;">
        
            <!-- Header -->
            <div style="text-align:center; margin-bottom:5px;">
                <h1 style="color:#00bcd4; margin:0; font-size:30px;">📩 Reply from Ar-Ra’d</h1>
                <p style="font-size:14px; color:#aaa; margin-top:5px;">
                    We’ve responded to your inquiry.
                </p>
                <hr style="border:none; border-top:1px solid #333;">
            </div>

            <!-- Message -->
            <div style="padding:10px;">
                <p style="font-size:15px; line-height:1.6; color:#e0e0e0; white-space:pre-line; margin: 0;">
                    {{message}}
                </p>
            </div>

            <!-- Signature -->
            <div style="padding:10px;">
                <p style="font-size:15px; line-height:1.6; text-align:left; color:#e0e0e0;">
                    Regards, <br>
                    <strong style="color:#00bcd4;">
                        The Ar-Ra’d Team
                    </strong>
                </p>
            </div>

            <!-- Footer -->
            <hr style="margin:25px 0; border:none; border-top:1px solid #333;">
            <p style="font-size:12px; color:#888; text-align:center; line-height:1.5;">
                This message was sent to you by Ar-Ra’d in response to your contact form submission.
            </p>
        </div>

    </body>
</html>
