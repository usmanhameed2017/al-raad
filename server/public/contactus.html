<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>New Contact Message</title>
</head>
    <body style="margin:0; padding:0; font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif;">

        <div style="max-width:600px; margin:40px auto; padding:25px; background:#121212; border-radius:15px; box-shadow:0 4px 20px rgba(0,0,0,0.6); color:#e0e0e0;">
        
            <!-- Header -->
            <div style="text-align:center; margin-bottom:25px;">
                <h1 style="color:#00bcd4; margin:0; font-size:30px;">📬 Contact Form Submission</h1>
                <p style="font-size:14px; color:#aaa; margin-top:5px;"> You have received a new inquiry from a user. </p>
                <hr style="border:none; border-top:1px solid #333;">
            </div>

            <!-- User Details -->
            <div style="background:#1e1e1e; padding:20px; border-radius:12px; margin-bottom:20px;">
                <h2 style="color:#00bcd4; font-size:18px; margin-bottom:15px;">👤 User Details</h2>
                
                <p style="margin:8px 0; font-size:15px;">
                    <strong style="color:#00bcd4;">Name:</strong> {{name}}
                </p>
                <p style="margin:8px 0; font-size:15px;">
                    <strong style="color:#00bcd4;">Email:</strong> {{email}}
                </p>
                <p style="margin:8px 0; font-size:15px;">
                    <strong style="color:#00bcd4;">Subject:</strong> {{subject}}
                </p>
            </div>

            <!-- Message -->
            <div style="background:#1a1a1a; padding:20px; border-radius:12px; margin-bottom:20px; border-left:4px solid #00bcd4;">
                <h2 style="color:#00bcd4; font-size:18px; margin-bottom:10px;">💬 Message</h2>
                <p style="font-size:15px; line-height:1.6; color:#e0e0e0; white-space:pre-line;">
                    {{message}}
                </p>
            </div>

            <!-- Footer -->
            <hr style="margin:25px 0; border:none; border-top:1px solid #333;">
            <p style="font-size:12px; color:#888; text-align:center; line-height:1.5;">
                This email was generated from the Contact Us form. <br>
                Reply directly to this email to connect with <span style="color:#00bcd4;">{{name}}</span>.
            </p>
        </div>

    </body>
</html>
